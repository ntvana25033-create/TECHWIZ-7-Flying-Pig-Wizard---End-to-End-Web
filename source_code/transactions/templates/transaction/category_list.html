<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Income and Expense Categories</title>
    <style>
        :root {
            --primary-green: #2e7d32; 
            --light-green: #e8f5e9; 
            --hover-green: #1b5e20; 
            --border-green: #a5d6a7; 
            --text-dark: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f8e9; 
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.15);
            width: 100%;
            max-width: 600px;
            border-top: 6px solid var(--primary-green);
        }

        h1 {
            color: var(--primary-green);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        a.btn-back {
            display: inline-block;
            background-color: var(--primary-green);
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }

        a.btn-back:hover {
            background-color: var(--hover-green);
        }

        hr {
            border: 0;
            height: 1px;
            background-color: var(--border-green);
            margin-bottom: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            background-color: var(--light-green);
            margin-bottom: 12px;
            padding: 15px 20px;
            border-radius: 8px;
            border-left: 5px solid var(--primary-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        li:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }

        li strong {
            color: var(--primary-green);
            font-size: 16px;
        }
        
        .category-type {
            font-size: 13px;
            color: #2e7d32;
            background-color: #c8e6c9;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .empty-msg {
            text-align: center;
            color: #777;
            background-color: transparent;
            border: none;
            display: block;
            font-style: italic;
        }
        
        .empty-msg:hover {
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Category List</h1>
        <a href="{% url 'transactions:transaction-list' %}" class="btn-back">⬅ Back to Transactions</a>
        <hr>
        <ul>
            {% for category in categories %}
                <li>
                    <strong>{{ category.name }}</strong> 
                    <span class="category-type">{{ category.get_type_display }}</span>
                </li>
            {% empty %}
                <li class="empty-msg">There are no categories in the system yet.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
