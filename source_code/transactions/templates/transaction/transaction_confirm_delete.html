<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Deletion</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fdf4; 
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.15);
            border-top: 5px solid #22c55e; 
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h1 {
            color: #166534;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 16px;
            color: #4b5563;
        }

        strong {
            color: #15803d; 
            font-size: 18px;
        }

        form {
            display: flex;
            justify-content: center;
            gap: 15px; 
        }

        button[type="submit"] {
            background-color: #ef4444; 
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
            font-weight: 600;
        }

        button[type="submit"]:hover {
            background-color: #dc2626;
        }

        a.btn-cancel {
            background-color: #22c55e;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            transition: background-color 0.2s ease-in-out;
            font-weight: 600;
            display: inline-block;
        }

        a.btn-cancel:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confirm Transaction Deletion</h1>
        <p>Are you sure you want to delete this transaction: <br>
            <strong>{{ object.amount }} VND - {{ object.category.name|default:"No category" }}</strong> <br>
            on <strong>{{ object.date|date:"d/m/Y" }}</strong>?
        </p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit">Yes, delete it</button>
            <a href="{% url 'transactions:transaction-list' %}" class="btn-cancel">No, go back</a>
        </form>
    </div>
</body>
</html>
