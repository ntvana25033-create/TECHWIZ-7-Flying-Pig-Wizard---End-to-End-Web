<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% if object %}Edit transaction{% else %}Add transaction{% endif %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8f5e9;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            border-top: 6px solid #4caf50; 
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #1b5e20; 
            margin-bottom: 25px;
        }

        form p {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        form label {
            font-weight: 600;
            margin-bottom: 6px;
            color: #2e7d32; 
        }

        form input[type="text"],
        form input[type="number"],
        form input[type="date"],
        form select,
        form textarea {
            padding: 10px 12px;
            border: 1px solid #a5d6a7;
            border-radius: 6px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: #4caf50;
            outline: none;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
            background-color: #ffffff;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button[type="submit"] {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button[type="submit"]:hover {
            background-color: #388e3c;
        }
        
        button[type="submit"]:active {
            transform: scale(0.98);
        }

        .btn-cancel {
            color: #757575;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .btn-cancel:hover {
            color: #d32f2f; 
            text-decoration: underline;
        }

        .ai-status {
            min-height: 20px;
            margin: -8px 0 16px;
            padding: 0 2px;
            font-size: 13px;
            color: #5f6f65;
        }

        .ai-status.is-success {
            color: #2e7d32;
            font-weight: 600;
        }

        .ai-status.is-warning {
            color: #9a6700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{% if object %}Edit transaction{% else %}Add new transaction{% endif %}</h1>
        
        <form
            method="post"
            id="transactionForm"
            data-categories-url="{% url 'transactions:ajax_load_categories' %}"
            data-ai-predict-url="{% url 'transactions:ajax_ai_predict' %}"
        >
            {% csrf_token %}
            
            {{ form.as_p }}
            <div id="aiStatus" class="ai-status" aria-live="polite"></div>
            
            <div class="actions">
                <button type="submit">Save</button>
                <a href="{% url 'transactions:transaction-list' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('transactionForm');
            const typeSelect = document.getElementById('id_type');
            const categorySelect = document.getElementById('id_category');
            const descriptionInput = document.getElementById('id_description');
            const aiStatus = document.getElementById('aiStatus');
            const categoriesUrl = form.dataset.categoriesUrl;
            const aiPredictUrl = form.dataset.aiPredictUrl;

            let predictionTimer = null;
            let predictionRequest = null;
            let categoriesRequest = null;

            function setAIStatus(message = '', state = '') {
                aiStatus.textContent = message;
                aiStatus.className = 'ai-status';
                if (state) {
                    aiStatus.classList.add(`is-${state}`);
                }
            }

            async function loadCategories(selectedType, selectedCategoryId = '') {
                if (categoriesRequest) {
                    categoriesRequest.abort();
                }

                categorySelect.innerHTML = '<option value="">---------</option>';
                categorySelect.disabled = !selectedType;

                if (!selectedType) {
                    return;
                }

                categoriesRequest = new AbortController();

                try {
                    const response = await fetch(
                        `${categoriesUrl}?type=${encodeURIComponent(selectedType)}`,
                        { signal: categoriesRequest.signal }
                    );

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const categories = await response.json();
                    categories.forEach(function(category) {
                        const option = document.createElement('option');
                        option.value = String(category.id);
                        option.textContent = category.name;
                        option.selected = String(category.id) === String(selectedCategoryId);
                        categorySelect.appendChild(option);
                    });
                    categorySelect.disabled = false;
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.error('Error fetching categories:', error);
                        setAIStatus('Không tải được danh mục. Hãy thử lại.', 'warning');
                    }
                }
            }

            async function predictCategory() {
                const description = descriptionInput.value.trim();
                const selectedType = typeSelect.value;

                if (!description) {
                    setAIStatus('');
                    return;
                }

                if (!selectedType) {
                    setAIStatus('Chọn Type trước để AI có thể tự điền Category.', 'warning');
                    return;
                }

                if (predictionRequest) {
                    predictionRequest.abort();
                }
                predictionRequest = new AbortController();
                setAIStatus('AI đang dự đoán Category...');

                try {
                    const params = new URLSearchParams({
                        description: description,
                        type: selectedType,
                    });
                    const response = await fetch(`${aiPredictUrl}?${params.toString()}`, {
                        signal: predictionRequest.signal,
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();

                    if (
                        typeSelect.value !== selectedType ||
                        descriptionInput.value.trim() !== description
                    ) {
                        return;
                    }

                    const prediction = data.prediction;

                    if (!prediction) {
                        setAIStatus('AI chưa có đủ dữ liệu để gợi ý Category.', 'warning');
                        return;
                    }

                    const predictedId = String(prediction.category_id);
                    const optionExists = Array.from(categorySelect.options).some(
                        option => option.value === predictedId
                    );

                    if (!optionExists) {
                        await loadCategories(selectedType);
                    }

                    if (
                        typeSelect.value !== selectedType ||
                        descriptionInput.value.trim() !== description
                    ) {
                        return;
                    }

                    categorySelect.value = predictedId;

                    if (categorySelect.value !== predictedId) {
                        setAIStatus('AI có dự đoán nhưng Category tương ứng không còn tồn tại.', 'warning');
                        return;
                    }

                    const similarity = Math.round(Number(prediction.confidence || 0) * 100);
                    setAIStatus(
                        `AI đã tự điền: ${prediction.category_name} (điểm tương đồng ${similarity}%). Bạn vẫn có thể đổi Category trước khi Save.`,
                        'success'
                    );
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.error('Error predicting category:', error);
                        setAIStatus('Không thể lấy gợi ý từ AI lúc này.', 'warning');
                    }
                }
            }

            function schedulePrediction() {
                clearTimeout(predictionTimer);
                predictionTimer = setTimeout(predictCategory, 500);
            }

            typeSelect.addEventListener('change', async function() {
                clearTimeout(predictionTimer);
                if (predictionRequest) {
                    predictionRequest.abort();
                }
                setAIStatus('');
                await loadCategories(typeSelect.value);
                if (descriptionInput.value.trim()) {
                    predictCategory();
                }
            });

            descriptionInput.addEventListener('input', schedulePrediction);
            descriptionInput.addEventListener('blur', function() {
                clearTimeout(predictionTimer);
                predictCategory();
            });

            const initialCategory = categorySelect.value;
            if (typeSelect.value) {
                loadCategories(typeSelect.value, initialCategory);
            } else {
                categorySelect.disabled = true;
            }
        });
    </script>
</body>
</html>
